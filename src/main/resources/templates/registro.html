<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro - AdminApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="width: 25rem;">
    <h2 class="text-center mb-4">📝 Crear Cuenta</h2>

    <!-- Alerta si hay un error (usuario repetido o contraseña débil) -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${param.exito}" class="alert alert-success">
        ¡Cuenta creada con éxito! Ahora puedes iniciar sesión.
    </div>

    <form th:action="@{/registro}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Nombre de Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
            <div class="form-text">Debe incluir mayúscula, minúscula y un número.</div>
        </div>

        <button type="submit" class="btn btn-success w-100 mb-3">Registrarse</button>

        <div class="text-center">
            <a href="/login" class="text-decoration-none">¿Ya tienes cuenta? Inicia Sesión</a>
        </div>

        <div class="text-center mt-3">
            <a href="/registro" class="text-decoration-none">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </form>
</div>

</body>
</html>
