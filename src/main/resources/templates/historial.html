<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Búsquedas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Historial de Búsquedas (IA)</h2>
        <a th:href="@{/}" class="btn btn-secondary">← Volver al Inicio</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover mt-3">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Pokémon Buscado</th>
                    <th>Fecha y Hora</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iteramos sobre la lista de búsquedas que nos manda Java -->
                <tr th:each="busqueda : ${busquedas}">
                    <td th:text="${busqueda.id}"></td>
                    <td>
                        <span class="badge bg-primary" th:text="${busqueda.usuario}"></span>
                    </td>
                    <td class="text-capitalize fw-bold" th:text="${busqueda.pokemon}"></td>
                    <!-- Formateamos la fecha para que se lea mejor -->
                    <td th:text="${#temporals.format(busqueda.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
                </tr>
                </tbody>
            </table>

            <!-- Mensaje por si la tabla está vacía -->
            <div th:if="${#lists.isEmpty(busquedas)}" class="alert alert-warning text-center">
                Aún no se ha realizado ninguna búsqueda.
            </div>
        </div>
    </div>
</div>

</body>
</html>
